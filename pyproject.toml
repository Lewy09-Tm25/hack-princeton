[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool"
version = "0.1.0"
description = "Open-source tool for investigating safety risks inside language models on local hardware."
readme = "CLAUDE.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic==2.13.4",
]

[project.optional-dependencies]
engine = [
    "torch==2.7.1",
    "transformers==5.10.2",
    "nnsight==0.8.1",
    "accelerate==1.13.0",
    "huggingface_hub==1.18.0",
    "safetensors==0.5.3",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==23.0.1",
    "fastapi==0.115.0",
    "starlette>=0.38.6,<0.42.0",
    "uvicorn>=0.31.1,<1.0.0",
    "websockets==15.0.1",
    "mcp==1.26.0",
    "typer==0.25.1",
    "jinja2==3.1.6",
    "plotly==6.0.1",
    "jupyter_client==8.6.3",
    "ipykernel==6.29.5",
    "peft==0.21.3",
]
agent = [
    "claude-agent-sdk==0.2.177",
]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.10",
    "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
tool = "engine.cli.main:app"

[project.entry-points."tool.checks"]
sycophancy = "engine.checks.sycophancy:SycophancyCheck"
refusal = "engine.checks.refusal:RefusalCheck"
backdoor = "engine.checks.backdoor:BackdoorCheck"
hidden_bias = "engine.checks.described.hidden_bias:HiddenBiasCheck"
drift = "engine.checks.described.drift:BehaviorDriftCheck"
data_poisoning = "engine.checks.described.data_poisoning:DataPoisoningCheck"
eval_awareness = "engine.checks.described.eval_awareness:EvaluationAwarenessCheck"
alignment_faking = "engine.checks.described.alignment_faking:AlignmentFakingCheck"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: tests that download or run real language models",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
