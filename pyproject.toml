[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool"
version = "0.1.0"
description = "Open-source tool for investigating safety risks inside language models on local hardware."
readme = "CLAUDE.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.13.4,<3.0.0",
]

[project.optional-dependencies]
engine = [
    "torch>=2.7.1,<3.0.0",
    "transformers>=5.10.2,<6.0.0",
    "nnsight>=0.8.1,<0.9.0",
    "accelerate>=1.13.0,<2.0.0",
    "huggingface_hub>=1.18.0,<2.0.0",
    "safetensors>=0.5.3,<1.0.0",
    "scikit-learn>=1.6.1,<2.0.0",
    "scipy>=1.13.1,<2.0.0",
    "numpy>=1.26.4,<3.0.0",
    "pandas>=2.2.3,<3.0.0",
    "pyarrow>=23.0.1,<24.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.6,<1.0.0",
    "websockets>=15.0.1,<16.0.0",
    "mcp>=1.26.0,<2.0.0",
    "typer>=0.25.1,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "plotly>=6.0.1,<7.0.0",
    "jupyter_client>=8.6.3,<9.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "peft>=0.15.0,<1.0.0",
]
agent = [
    "claude-agent-sdk==0.2.177",
]
sae = [
    "sae-lens==6.55.5",
]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-asyncio>=0.26.0,<1.0.0",
    "ruff>=0.11.10,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
tool = "engine.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: tests that download or run real language models",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
